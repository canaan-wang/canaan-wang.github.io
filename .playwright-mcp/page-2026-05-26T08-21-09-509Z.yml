          - paragraph [ref=e519]:
            - text: RabbitMQ 默认使用
            - strong [ref=e520]: Push 模型
            - text: ：Broker 主动将消息推送给 Consumer，效率高。但默认没有流量控制，一个 Consumer 可能一次性收到大量未 ack 消息，导致内存溢出或其他 Consumer 饿死。
          - paragraph [ref=e521]:
            - strong [ref=e522]: Prefetch（QoS）是生产环境必配项
            - text: ：
          - generic [ref=e523]:
            - button "Copy Code" [ref=e524] [cursor=pointer]
            - code [ref=e526]:
              - generic [ref=e527]: prefetch = N 表示 Broker 最多给消费者推送 N 条未 ack 的消息
          - list [ref=e528]:
            - listitem [ref=e529]:
              - text: CPU 密集型业务：
              - code [ref=e530]: prefetch = 1~5
            - listitem [ref=e531]:
              - text: IO 密集型业务：
              - code [ref=e532]: prefetch = 10~50
            - listitem [ref=e533]:
              - text: 需要严格顺序：
              - code [ref=e534]: prefetch = 1
              - text: + 单消费者
          - paragraph [ref=e535]:
            - text: Prefetch 的本质是
            - strong [ref=e536]: 背压（backpressure）
            - text: ：Consumer 处理能力下降时，未 ack 消息堆积达到 prefetch 上限，Broker 停止向该 Consumer 推送，消息自然流向其他空闲 Consumer。
