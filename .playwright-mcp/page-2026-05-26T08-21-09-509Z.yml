              - row "死信队列 DLQ 多次失败的消息隔离到 DLQ，避免阻塞正常队列" [ref=e479]:
                - cell "死信队列 DLQ" [ref=e480]:
                  - strong [ref=e481]: 死信队列 DLQ
                - cell "多次失败的消息隔离到 DLQ，避免阻塞正常队列" [ref=e482]
          - paragraph [ref=e483]:
            - strong [ref=e484]: 死信触发条件
            - text: ：消息被拒绝且不重回队列（
            - code [ref=e485]: requeue=false
            - text: ）、消息 TTL 过期、队列长度超限。
          - paragraph [ref=e486]:
            - strong [ref=e487]: 幂等是必须项
            - text: ：RabbitMQ 保证"至少一次投递"，网络重连、ack 丢失、消费者重启都会导致重投。业务端幂等 + MQ 至少一次投递 = 事实上的精确一次。RabbitMQ 不像 Kafka 有 exactly-once 事务语义，幂等是消费者必须自己做的事。
          - paragraph [ref=e488]:
            - strong [ref=e489]: 无限重投陷阱
            - text: ：
            - code [ref=e490]: basicNack(requeue=true)
            - text: 如果 Consumer 代码有 bug（如反序列化异常），会形成死循环把队列打爆。应限制重试次数（消息头
            - code [ref=e491]: x-death
            - text: 数组记录每次死信信息，超过 N 次直接进 DLQ），或用延迟队列做退避。
