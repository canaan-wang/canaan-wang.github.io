          - list [ref=e455]:
            - listitem [ref=e456]:
              - text: Exchange、Queue、Message
              - strong [ref=e457]: 三者都持久化
              - text: （见上文"三要素"）。
            - listitem [ref=e458]:
              - text: 使用
              - strong [ref=e459]: Quorum Queue
              - text: （多节点 Raft 复制），而非单机 Classic Queue。
            - listitem [ref=e460]:
              - text: 集群至少 3 节点，磁盘/内存水位（
              - code [ref=e461]: vm_memory_high_watermark
