              - text: ：生产者发送消息时附带的路由标签，跟着消息走。
            - listitem [ref=e350]:
              - strong [ref=e351]: Binding Key
              - text: ：声明 Binding 时设置的匹配模式，跟着绑定关系走。
          - paragraph [ref=e352]: 匹配逻辑取决于 Exchange 类型：
          - document [ref=e354]:
            - generic [ref=e356]:
              - generic [ref=e360]:
                - paragraph [ref=e366]:
                  - text: "bindingKey: order.*.created"
                  - text: 匹配（* = web）
                - paragraph [ref=e372]:
                  - text: "bindingKey: order.#"
                  - text: 匹配（# 包含 web.created）
                - paragraph [ref=e378]:
                  - text: "bindingKey: payment.#"
                  - text: 不匹配
              - generic [ref=e379]:
                - paragraph [ref=e386]:
                  - text: Producer
                  - text: "routingKey: order.web.created"
                - paragraph [ref=e393]: topic Exchange
                - paragraph [ref=e400]: 下单通知队列
                - paragraph [ref=e407]: 全量审计队列
                - paragraph [ref=e414]: 支付队列
          - paragraph [ref=e415]: 一个 Exchange 可以通过不同 Binding Key 绑定到多个 Queue；一个 Queue 也可以通过多个 Binding Key 绑定到同一个 Exchange，实现"或"关系的复合订阅。
          - separator [ref=e416]
          - heading "Connection & Channel 模型 Permalink to \"Connection & Channel 模型\"" [level=2] [ref=e417]:
            - text: Connection & Channel 模型
            - link "Permalink to \"Connection & Channel 模型\"" [ref=e418] [cursor=pointer]:
