                  - text: ，处理失败或崩溃时消息重新投递
              - row "幂等去重 基于业务唯一键（如订单号）查处理记录表或 Redis SETNX，防止重复消费" [ref=e475]:
                - cell "幂等去重" [ref=e476]:
                  - strong [ref=e477]: 幂等去重
