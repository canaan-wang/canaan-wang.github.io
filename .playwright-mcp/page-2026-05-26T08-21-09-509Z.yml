              - text: "#"
          - list [ref=e419]:
            - listitem [ref=e420]:
              - strong [ref=e421]: Connection
              - text: ：与 Broker 的 TCP 长连接，
              - strong [ref=e422]: 重量级
              - text: ，应用生命周期内保持，不要频繁创建销毁。
            - listitem [ref=e423]:
              - strong [ref=e424]: Channel
              - text: ：在 Connection 之上的
              - strong [ref=e425]: 逻辑通道
              - text: ，AMQP 的所有操作（声明、发送、消费）都在 Channel 上进行。
          - paragraph [ref=e426]:
            - strong [ref=e427]: Channel 不是线程安全的
            - text: 。同一 Channel 不能跨线程并发发送。Spring AMQP 的
            - code [ref=e428]: CachingConnectionFactory
            - text: 会缓存 Channel，多线程场景下每个线程使用独立的 Channel，应用层通常不需要额外处理。但如果自定义 Channel，必须保证线程隔离。
