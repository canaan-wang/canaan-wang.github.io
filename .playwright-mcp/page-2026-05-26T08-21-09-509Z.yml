                  - code [ref=e451]: mandatory=true
                  - text: 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息
          - paragraph [ref=e452]: Confirm 是异步的，不阻塞发送线程。如果业务需要强一致性，可配合本地消息表（Outbox 模式）：先写业务 DB + 消息记录表，异步任务扫描未确认记录重发。
          - heading "Broker 端：持久化 + Quorum Queue Permalink to \"Broker 端：持久化 + Quorum Queue\"" [level=3] [ref=e453]:
