          - paragraph [ref=e463]:
            - text: Binding 是 Exchange 和 Queue 之间的路由规则声明，携带一个
            - code [ref=e464]: bindingKey
            - text: （绑定键）。
          - paragraph [ref=e465]:
            - strong [ref=e466]: 两个容易混淆的概念
            - text: ：
          - list [ref=e467]:
            - listitem [ref=e468]:
              - strong [ref=e469]: Routing Key
              - text: ：生产者发送消息时附带的路由标签，跟着消息走。
            - listitem [ref=e470]:
              - strong [ref=e471]: Binding Key
              - text: ：声明 Binding 时设置的匹配模式，跟着绑定关系走。
          - paragraph [ref=e472]: 匹配逻辑取决于 Exchange 类型：
          - paragraph [ref=e473]: 一个 Exchange 可以通过不同 Binding Key 绑定到多个 Queue；一个 Queue 也可以通过多个 Binding Key 绑定到同一个 Exchange，实现"或"关系的复合订阅。
          - separator [ref=e474]
          - heading "Connection & Channel 模型 Permalink to \"Connection & Channel 模型\"" [level=2] [ref=e475]:
