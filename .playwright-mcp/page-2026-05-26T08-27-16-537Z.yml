              - strong [ref=e153]: 灵活路由
              - text: ：通过 Exchange + Binding + Routing Key 组合，支持广播、点对点、按主题订阅等多种路由模式。
            - listitem [ref=e154]:
              - strong [ref=e155]: 可靠投递
              - text: ：支持发布确认、消费确认、消息持久化、Quorum Queue 复制，消息不易丢。
            - listitem [ref=e156]:
              - strong [ref=e157]: 低延迟
              - text: ：消息默认走内存，微秒级延迟，适合实时性要求高的业务。
            - listitem [ref=e158]:
              - strong [ref=e159]: 丰富消息模式
              - text: ：原生支持死信队列、延迟队列、优先级队列。
            - listitem [ref=e160]:
              - strong [ref=e161]: 管理界面
              - text: ：自带 Web UI，可视化查看队列状态、消息堆积、消费者情况。
