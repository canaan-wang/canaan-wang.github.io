              - text: "#"
          - paragraph [ref=e454]:
            - text: 声明队列时如果参数（如
            - code [ref=e455]: x-message-ttl
            - text: 、
            - code [ref=e456]: x-max-length
            - text: 、
            - code [ref=e457]: x-queue-type
            - text: ）与已存在队列不一致，会
            - strong [ref=e458]:
              - text: 直接报错
              - code [ref=e459]: PRECONDITION_FAILED
            - text: 。生产环境修改队列参数需要：建新队列 → 切流 → 排空旧队列 → 删旧队列。前期设计要尽量考虑周全，避免后期改结构。
