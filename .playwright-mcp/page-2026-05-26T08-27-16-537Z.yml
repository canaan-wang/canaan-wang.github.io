          - paragraph [ref=e439]:
            - text: 消息在 Broker 重启后不丢失，需要
            - strong [ref=e440]: 三者同时持久化
            - text: ：
          - list [ref=e441]:
            - listitem [ref=e442]:
              - strong [ref=e443]: Exchange
              - code [ref=e444]: durable=true
            - listitem [ref=e445]:
              - strong [ref=e446]: Queue
              - code [ref=e447]: durable=true
            - listitem [ref=e448]:
              - strong [ref=e449]: Message
              - code [ref=e450]: deliveryMode=2
              - text: （PERSISTENT）
          - paragraph [ref=e451]: 少任何一个，Broker 崩溃时消息都会丢失。这是"消息丢了"问题的头号排查点。
          - heading "队列参数的不可变性 Permalink to \"队列参数的不可变性\"" [level=3] [ref=e452]:
