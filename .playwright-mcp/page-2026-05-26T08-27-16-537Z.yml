            - text: Quorum Queue 的 Raft 复制
            - link "Permalink to \"Quorum Queue 的 Raft 复制\"" [ref=e686] [cursor=pointer]:
              - /url: "#quorum-queue-的-raft-复制"
              - text: "#"
          - paragraph [ref=e687]: Quorum Queue 是 RabbitMQ 3.8+ 引入的高可靠队列，基于 Raft 共识算法：
          - list [ref=e688]:
            - listitem [ref=e689]:
              - text: 一个 Queue 有
              - strong [ref=e690]: 1 个 Leader + N 个 Follower
              - text: ，分布在不同节点。
            - listitem [ref=e691]:
              - text: 写入需
              - strong [ref=e692]: 多数派确认
              - text: （W > N/2）才返回成功。
            - listitem [ref=e693]: Leader 宕机时，Follower 之间自动选举新 Leader，Consumer 自动重连到新 Leader。
          - paragraph [ref=e694]: 相比旧版的 Classic Mirrored Queue（已移除），Quorum Queue 的故障恢复更快、数据一致性更强，但写入延迟略高、不支持独占队列和非持久化消息。
          - heading "vhost 逻辑隔离 Permalink to \"vhost 逻辑隔离\"" [level=3] [ref=e695]:
