            - listitem [ref=e516]:
              - text: 使用
              - strong [ref=e517]: Quorum Queue
              - text: （多节点 Raft 复制），而非单机 Classic Queue。
            - listitem [ref=e518]:
              - text: 集群至少 3 节点，磁盘/内存水位（
              - code [ref=e519]: vm_memory_high_watermark
              - text: ）需监控，打满后 Broker 会拒绝新发布。
