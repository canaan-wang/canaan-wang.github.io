              - /url: "#vhost-逻辑隔离"
              - text: "#"
          - paragraph [ref=e697]: vhost（Virtual Host）是 RabbitMQ 的逻辑隔离单位，类似数据库的 schema：
          - list [ref=e698]:
            - listitem [ref=e699]: Exchange、Queue、用户权限都按 vhost 隔离。
            - listitem [ref=e700]:
              - text: 默认 vhost 是
              - code [ref=e701]: /
              - text: ，生产环境建议按业务或环境分 vhost（如
              - code [ref=e702]: /order-prod
              - text: 、
              - code [ref=e703]: /order-test
              - text: ）。
            - listitem [ref=e704]:
              - text: 开发联调时如果连上去发现什么 Queue 都没有，先检查
              - code [ref=e705]: virtual-host
              - text: 配置是否正确。
