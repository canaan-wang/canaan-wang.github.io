                - cell "按消息 Headers KV 匹配" [ref=e276]
                - cell "很少用，性能差" [ref=e277]
          - paragraph [ref=e278]:
            - strong [ref=e279]: 关键属性
            - text: ：
          - list [ref=e280]:
            - listitem [ref=e281]:
              - code [ref=e282]: durable=true
              - text: ：Broker 重启后 Exchange 定义保留。
            - listitem [ref=e283]:
              - code [ref=e284]: autoDelete=false
              - text: ：无 Queue 绑定时也不自动删除（生产环境推荐）。
          - paragraph [ref=e285]:
            - strong [ref=e286]: 黑洞消息陷阱
            - text: ：没有匹配到任何 Queue 的消息会被
            - strong [ref=e287]: 直接丢弃
            - text: 。必须配置
            - code [ref=e288]: mandatory=true
            - text: + Return 回调，或设置 Alternate Exchange 兜底，否则会出现"发送成功但消息消失"的灵异事件。
