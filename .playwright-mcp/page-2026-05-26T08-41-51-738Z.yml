          - paragraph [ref=e223]:
            - strong [ref=e224]: 一句话总结
            - text: ：RabbitMQ 的核心优势是
            - strong [ref=e225]: 路由灵活、延迟低、可靠性高、管理界面完善
            - text: ，适合订单、支付、事件驱动这类对消息不能丢、路由规则复杂的业务场景。
          - separator [ref=e226]
