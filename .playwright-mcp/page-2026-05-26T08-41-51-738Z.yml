          - paragraph [ref=e327]:
            - text: 消息在 Broker 重启后不丢失，需要
            - strong [ref=e328]: 三者同时持久化
            - text: ：
          - list [ref=e329]:
            - listitem [ref=e330]:
              - strong [ref=e331]: Exchange
              - code [ref=e332]: durable=true
            - listitem [ref=e333]:
              - strong [ref=e334]: Queue
              - code [ref=e335]: durable=true
            - listitem [ref=e336]:
              - strong [ref=e337]: Message
              - code [ref=e338]: deliveryMode=2
              - text: （PERSISTENT）
          - paragraph [ref=e339]: 少任何一个，Broker 崩溃时消息都会丢失。这是"消息丢了"问题的头号排查点。
