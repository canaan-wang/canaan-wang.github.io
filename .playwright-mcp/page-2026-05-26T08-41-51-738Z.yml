            - text: Quorum Queue 的 Raft 复制
            - link "Permalink to \"Quorum Queue 的 Raft 复制\"" [ref=e549] [cursor=pointer]:
              - /url: "#quorum-queue-的-raft-复制"
              - text: "#"
          - paragraph [ref=e550]: Quorum Queue 是 RabbitMQ 3.8+ 引入的高可靠队列，基于 Raft 共识算法：
          - list [ref=e551]:
            - listitem [ref=e552]:
              - text: 一个 Queue 有
              - strong [ref=e553]: 1 个 Leader + N 个 Follower
              - text: ，分布在不同节点。
            - listitem [ref=e554]:
              - text: 写入需
              - strong [ref=e555]: 多数派确认
              - text: （W > N/2）才返回成功。
            - listitem [ref=e556]: Leader 宕机时，Follower 之间自动选举新 Leader，Consumer 自动重连到新 Leader。
          - paragraph [ref=e557]: 相比旧版的 Classic Mirrored Queue（已移除），Quorum Queue 的故障恢复更快、数据一致性更强，但写入延迟略高、不支持独占队列和非持久化消息。
          - heading "vhost 逻辑隔离 Permalink to \"vhost 逻辑隔离\"" [level=3] [ref=e558]:
            - text: vhost 逻辑隔离
            - link "Permalink to \"vhost 逻辑隔离\"" [ref=e559] [cursor=pointer]:
              - /url: "#vhost-逻辑隔离"
              - text: "#"
          - paragraph [ref=e560]: vhost（Virtual Host）是 RabbitMQ 的逻辑隔离单位，类似数据库的 schema：
          - list [ref=e561]:
            - listitem [ref=e562]: Exchange、Queue、用户权限都按 vhost 隔离。
            - listitem [ref=e563]:
              - text: 默认 vhost 是
              - code [ref=e564]: /
              - text: ，生产环境建议按业务或环境分 vhost（如
              - code [ref=e565]: /order-prod
              - text: 、
              - code [ref=e566]: /order-test
              - text: ）。
            - listitem [ref=e567]:
              - text: 开发联调时如果连上去发现什么 Queue 都没有，先检查
              - code [ref=e568]: virtual-host
              - text: 配置是否正确。
