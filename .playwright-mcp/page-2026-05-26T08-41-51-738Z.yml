                - columnheader "原理" [ref=e414]
            - rowgroup [ref=e415]:
              - row "manual ack 业务真正处理完成才发送 basicAck，处理失败或崩溃时消息重新投递" [ref=e416]:
                - cell "manual ack" [ref=e417]:
                  - code [ref=e418]: manual ack
                - cell "业务真正处理完成才发送 basicAck，处理失败或崩溃时消息重新投递" [ref=e419]:
                  - text: 业务真正处理完成才发送
                  - code [ref=e420]: basicAck
                  - text: ，处理失败或崩溃时消息重新投递
              - row "幂等去重 基于业务唯一键（如订单号）查处理记录表或 Redis SETNX，防止重复消费" [ref=e421]:
                - cell "幂等去重" [ref=e422]:
                  - strong [ref=e423]: 幂等去重
                - cell "基于业务唯一键（如订单号）查处理记录表或 Redis SETNX，防止重复消费" [ref=e424]
              - row "死信队列 DLQ 多次失败的消息隔离到 DLQ，避免阻塞正常队列" [ref=e425]:
                - cell "死信队列 DLQ" [ref=e426]:
                  - strong [ref=e427]: 死信队列 DLQ
                - cell "多次失败的消息隔离到 DLQ，避免阻塞正常队列" [ref=e428]
          - paragraph [ref=e429]:
            - strong [ref=e430]: 死信触发条件
            - text: ：消息被拒绝且不重回队列（
            - code [ref=e431]: requeue=false
            - text: ）、消息 TTL 过期、队列长度超限。
          - paragraph [ref=e432]:
            - strong [ref=e433]: 幂等是必须项
            - text: ：RabbitMQ 保证"至少一次投递"，网络重连、ack 丢失、消费者重启都会导致重投。业务端幂等 + MQ 至少一次投递 = 事实上的精确一次。RabbitMQ 不像 Kafka 有 exactly-once 事务语义，幂等是消费者必须自己做的事。
          - paragraph [ref=e434]:
            - strong [ref=e435]: 无限重投陷阱
            - text: ：
            - code [ref=e436]: basicNack(requeue=true)
            - text: 如果 Consumer 代码有 bug（如反序列化异常），会形成死循环把队列打爆。应限制重试次数（消息头
            - code [ref=e437]: x-death
            - text: 数组记录每次死信信息，超过 N 次直接进 DLQ），或用延迟队列做退避。
