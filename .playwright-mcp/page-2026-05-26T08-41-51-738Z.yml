              - text: "#"
          - paragraph [ref=e571]: 自带 Web 管理界面（默认 15672 端口）是排查神器，重点关注：
          - list [ref=e572]:
            - listitem [ref=e573]:
              - strong [ref=e574]: Queues
              - text: ：Ready（未消费数）、Unacked（已投递未确认数）、消费者数、入队/出队速率。
              - strong [ref=e575]: 消息堆积排查的第一站
              - text: 。
            - listitem [ref=e576]:
