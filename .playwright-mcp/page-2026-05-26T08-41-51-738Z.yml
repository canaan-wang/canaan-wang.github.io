              - row "fanout 忽略 Routing Key，广播给所有绑定 Queue 事件多消费方" [ref=e260]:
                - cell "fanout" [ref=e261]:
                  - code [ref=e262]: fanout
                - cell "忽略 Routing Key，广播给所有绑定 Queue" [ref=e263]:
                  - strong [ref=e264]: 忽略
                  - text: Routing Key，广播给所有绑定 Queue
                - cell "事件多消费方" [ref=e265]
              - 'row "topic Binding Key 用 *（一个单词）和 #（零或多个单词）通配 灵活订阅，最常用" [ref=e266]':
                - cell "topic" [ref=e267]:
                  - code [ref=e268]: topic
                - 'cell "Binding Key 用 *（一个单词）和 #（零或多个单词）通配" [ref=e269]':
                  - text: Binding Key 用
                  - code [ref=e270]: "*"
                  - text: （一个单词）和
                  - code [ref=e271]: "#"
                  - text: （零或多个单词）通配
                - cell "灵活订阅，最常用" [ref=e272]
              - row "headers 按消息 Headers KV 匹配 很少用，性能差" [ref=e273]:
                - cell "headers" [ref=e274]:
