          - paragraph [ref=e342]:
            - text: 声明队列时如果参数（如
            - code [ref=e343]: x-message-ttl
            - text: 、
            - code [ref=e344]: x-max-length
            - text: 、
            - code [ref=e345]: x-queue-type
            - text: ）与已存在队列不一致，会
            - strong [ref=e346]:
              - text: 直接报错
              - code [ref=e347]: PRECONDITION_FAILED
            - text: 。生产环境修改队列参数需要：建新队列 → 切流 → 排空旧队列 → 删旧队列。前期设计要尽量考虑周全，避免后期改结构。
          - separator [ref=e348]
          - heading "Binding 与路由匹配机制 Permalink to \"Binding 与路由匹配机制\"" [level=2] [ref=e349]:
            - text: Binding 与路由匹配机制
            - link "Permalink to \"Binding 与路由匹配机制\"" [ref=e350] [cursor=pointer]:
              - /url: "#binding-与路由匹配机制"
              - text: "#"
          - paragraph [ref=e351]:
            - text: Binding 是 Exchange 和 Queue 之间的路由规则声明，携带一个
            - code [ref=e352]: bindingKey
            - text: （绑定键）。
          - paragraph [ref=e353]:
            - strong [ref=e354]: 两个容易混淆的概念
            - text: ：
          - list [ref=e355]:
            - listitem [ref=e356]:
              - strong [ref=e357]: Routing Key
              - text: ：生产者发送消息时附带的路由标签，跟着消息走。
            - listitem [ref=e358]:
              - strong [ref=e359]: Binding Key
              - text: ：声明 Binding 时设置的匹配模式，跟着绑定关系走。
          - paragraph [ref=e360]: 匹配逻辑取决于 Exchange 类型：
          - paragraph [ref=e361]: 一个 Exchange 可以通过不同 Binding Key 绑定到多个 Queue；一个 Queue 也可以通过多个 Binding Key 绑定到同一个 Exchange，实现"或"关系的复合订阅。
          - separator [ref=e362]
          - heading "Connection & Channel 模型 Permalink to \"Connection & Channel 模型\"" [level=2] [ref=e363]:
            - text: Connection & Channel 模型
            - link "Permalink to \"Connection & Channel 模型\"" [ref=e364] [cursor=pointer]:
              - /url: "#connection-channel-模型"
              - text: "#"
          - list [ref=e365]:
            - listitem [ref=e366]:
              - strong [ref=e367]: Connection
              - text: ：与 Broker 的 TCP 长连接，
              - strong [ref=e368]: 重量级
              - text: ，应用生命周期内保持，不要频繁创建销毁。
            - listitem [ref=e369]:
              - strong [ref=e370]: Channel
              - text: ：在 Connection 之上的
              - strong [ref=e371]: 逻辑通道
              - text: ，AMQP 的所有操作（声明、发送、消费）都在 Channel 上进行。
          - paragraph [ref=e372]:
            - strong [ref=e373]: Channel 不是线程安全的
            - text: 。同一 Channel 不能跨线程并发发送。Spring AMQP 的
            - code [ref=e374]: CachingConnectionFactory
            - text: 会缓存 Channel，多线程场景下每个线程使用独立的 Channel，应用层通常不需要额外处理。但如果自定义 Channel，必须保证线程隔离。
          - separator [ref=e375]
          - heading "消息可靠性三段保障 Permalink to \"消息可靠性三段保障\"" [level=2] [ref=e376]:
            - text: 消息可靠性三段保障
            - link "Permalink to \"消息可靠性三段保障\"" [ref=e377] [cursor=pointer]:
              - /url: "#消息可靠性三段保障"
              - text: "#"
          - paragraph [ref=e378]: 要做到"消息不丢、不重复处理"，需要从生产端、Broker、消费端三段同时保障。
          - heading "生产端：Confirm + Return Permalink to \"生产端：Confirm + Return\"" [level=3] [ref=e379]:
            - text: 生产端：Confirm + Return
            - link "Permalink to \"生产端：Confirm + Return\"" [ref=e380] [cursor=pointer]:
              - /url: "#生产端-confirm-return"
              - text: "#"
          - table [ref=e381]:
            - rowgroup [ref=e382]:
              - row "机制 作用" [ref=e383]:
                - columnheader "机制" [ref=e384]
                - columnheader "作用" [ref=e385]
            - rowgroup [ref=e386]:
              - row "Publisher Confirm 消息到达 Broker 后异步回调 ack，网络失败或 Broker 拒收时回调 nack" [ref=e387]:
                - cell "Publisher Confirm" [ref=e388]:
                  - strong [ref=e389]: Publisher Confirm
                - cell "消息到达 Broker 后异步回调 ack，网络失败或 Broker 拒收时回调 nack" [ref=e390]:
                  - text: 消息到达 Broker 后异步回调
                  - code [ref=e391]: ack
                  - text: ，网络失败或 Broker 拒收时回调
                  - code [ref=e392]: nack
              - row "Return Callback mandatory=true 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息" [ref=e393]:
                - cell "Return Callback" [ref=e394]:
                  - strong [ref=e395]: Return Callback
                - cell "mandatory=true 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息" [ref=e396]:
                  - code [ref=e397]: mandatory=true
                  - text: 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息
          - paragraph [ref=e398]: Confirm 是异步的，不阻塞发送线程。如果业务需要强一致性，可配合本地消息表（Outbox 模式）：先写业务 DB + 消息记录表，异步任务扫描未确认记录重发。
          - heading "Broker 端：持久化 + Quorum Queue Permalink to \"Broker 端：持久化 + Quorum Queue\"" [level=3] [ref=e399]:
            - text: Broker 端：持久化 + Quorum Queue
            - link "Permalink to \"Broker 端：持久化 + Quorum Queue\"" [ref=e400] [cursor=pointer]:
              - /url: "#broker-端-持久化-quorum-queue"
              - text: "#"
          - list [ref=e401]:
            - listitem [ref=e402]:
              - text: Exchange、Queue、Message
              - strong [ref=e403]: 三者都持久化
              - text: （见上文"三要素"）。
            - listitem [ref=e404]:
              - text: 使用
              - strong [ref=e405]: Quorum Queue
              - text: （多节点 Raft 复制），而非单机 Classic Queue。
            - listitem [ref=e406]:
              - text: 集群至少 3 节点，磁盘/内存水位（
              - code [ref=e407]: vm_memory_high_watermark
              - text: ）需监控，打满后 Broker 会拒绝新发布。
          - heading "消费端：Manual Ack + 幂等 + 死信 Permalink to \"消费端：Manual Ack + 幂等 + 死信\"" [level=3] [ref=e408]:
