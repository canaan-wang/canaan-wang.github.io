          - paragraph [ref=e420]:
            - text: RabbitMQ 默认使用
            - strong [ref=e421]: Push 模型
            - text: ：Broker 主动将消息推送给 Consumer，效率高。但默认没有流量控制，一个 Consumer 可能一次性收到大量未 ack 消息，导致内存溢出或其他 Consumer 饿死。
          - paragraph [ref=e422]:
            - strong [ref=e423]: Prefetch（QoS）是生产环境必配项
            - text: ：
          - generic [ref=e424]:
            - button "Copy Code" [ref=e425] [cursor=pointer]
            - code [ref=e427]:
              - generic [ref=e428]: prefetch = N 表示 Broker 最多给消费者推送 N 条未 ack 的消息
          - list [ref=e429]:
            - listitem [ref=e430]:
              - text: CPU 密集型业务：
              - code [ref=e431]: prefetch = 1~5
            - listitem [ref=e432]:
              - text: IO 密集型业务：
              - code [ref=e433]: prefetch = 10~50
            - listitem [ref=e434]:
              - text: 需要严格顺序：
              - code [ref=e435]: prefetch = 1
              - text: + 单消费者
          - paragraph [ref=e436]:
            - text: Prefetch 的本质是
            - strong [ref=e437]: 背压（backpressure）
            - text: ：Consumer 处理能力下降时，未 ack 消息堆积达到 prefetch 上限，Broker 停止向该 Consumer 推送，消息自然流向其他空闲 Consumer。
