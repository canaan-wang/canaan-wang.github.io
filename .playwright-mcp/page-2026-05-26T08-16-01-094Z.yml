              - text: "#"
          - paragraph [ref=e445]: Quorum Queue 是 RabbitMQ 3.8+ 引入的高可靠队列，基于 Raft 共识算法：
          - list [ref=e446]:
            - listitem [ref=e447]:
              - text: 一个 Queue 有
              - strong [ref=e448]: 1 个 Leader + N 个 Follower
              - text: ，分布在不同节点。
            - listitem [ref=e449]:
              - text: 写入需
              - strong [ref=e450]: 多数派确认
              - text: （W > N/2）才返回成功。
            - listitem [ref=e451]: Leader 宕机时，Follower 之间自动选举新 Leader，Consumer 自动重连到新 Leader。
          - paragraph [ref=e452]: 相比旧版的 Classic Mirrored Queue（已移除），Quorum Queue 的故障恢复更快、数据一致性更强，但写入延迟略高、不支持独占队列和非持久化消息。
          - heading "vhost 逻辑隔离 Permalink to \"vhost 逻辑隔离\"" [level=3] [ref=e453]:
            - text: vhost 逻辑隔离
            - link "Permalink to \"vhost 逻辑隔离\"" [ref=e454] [cursor=pointer]:
              - /url: "#vhost-逻辑隔离"
              - text: "#"
          - paragraph [ref=e455]: vhost（Virtual Host）是 RabbitMQ 的逻辑隔离单位，类似数据库的 schema：
          - list [ref=e456]:
            - listitem [ref=e457]: Exchange、Queue、用户权限都按 vhost 隔离。
            - listitem [ref=e458]:
              - text: 默认 vhost 是
              - code [ref=e459]: /
              - text: ，生产环境建议按业务或环境分 vhost（如
              - code [ref=e460]: /order-prod
              - text: 、
              - code [ref=e461]: /order-test
              - text: ）。
            - listitem [ref=e462]:
              - text: 开发联调时如果连上去发现什么 Queue 都没有，先检查
              - code [ref=e463]: virtual-host
              - text: 配置是否正确。
