          - paragraph [ref=e184]:
            - text: RabbitMQ 与 Kafka 的本质区别不在性能，而在
            - strong [ref=e185]: 消息分发的抽象层
            - text: ：
          - list [ref=e186]:
            - listitem [ref=e187]:
              - strong [ref=e188]: Kafka
              - text: ：Producer → Topic → Partition → Consumer，路由在客户端决定（指定 partition key）。
            - listitem [ref=e189]:
              - strong [ref=e190]: RabbitMQ
              - text: ：Producer →
              - strong [ref=e191]: Exchange
              - text: → (Binding + Routing Key) → Queue → Consumer，路由在 Broker 内完成，支持运行时动态调整订阅关系。
          - paragraph [ref=e192]:
            - strong [ref=e193]: Exchange 是必选环节
            - text: 。即使生产者不指定 Exchange，消息也会走默认的
            - code [ref=e194]: "\"\""
            - text: Exchange（direct 类型，Routing Key 等于 Queue 名），这是新手容易忽略的设计细节。
          - separator [ref=e195]
          - heading "Exchange 路由原理 Permalink to \"Exchange 路由原理\"" [level=2] [ref=e196]:
            - text: Exchange 路由原理
            - link "Permalink to \"Exchange 路由原理\"" [ref=e197] [cursor=pointer]:
              - /url: "#exchange-路由原理"
              - text: "#"
          - paragraph [ref=e198]:
            - text: Exchange 是消息的路由分发器，
            - strong [ref=e199]: 生产者只能往 Exchange 发消息
            - text: ，不能直接发到 Queue。
