              - row "classic 内存为主，可选持久化到磁盘 单机或镜像队列（4.0 已移除镜像） 简单场景，逐步淘汰" [ref=e259]:
                - cell "classic" [ref=e260]:
                  - code [ref=e261]: classic
                - cell "内存为主，可选持久化到磁盘" [ref=e262]
                - cell "单机或镜像队列（4.0 已移除镜像）" [ref=e263]
                - cell "简单场景，逐步淘汰" [ref=e264]
              - row "quorum 日志复制 Raft 共识，多节点同步 高可靠生产环境，推荐" [ref=e265]:
                - cell "quorum" [ref=e266]:
                  - code [ref=e267]: quorum
                - cell "日志复制" [ref=e268]
                - cell "Raft 共识，多节点同步" [ref=e269]:
                  - strong [ref=e270]: Raft 共识
                  - text: ，多节点同步
                - cell "高可靠生产环境，推荐" [ref=e271]:
                  - text: 高可靠生产环境，
                  - strong [ref=e272]: 推荐
              - row "stream 追加日志 多副本 流式消费，类似 Kafka" [ref=e273]:
                - cell "stream" [ref=e274]:
                  - code [ref=e275]: stream
                - cell "追加日志" [ref=e276]
                - cell "多副本" [ref=e277]
                - cell "流式消费，类似 Kafka" [ref=e278]
          - paragraph [ref=e279]: Quorum Queue 基于 Raft 协议实现 leader 选举和日志复制，写入需多数派确认，牺牲部分吞吐量换取强一致性。Classic 镜像队列在 4.0 已彻底移除，新项目应默认使用 Quorum Queue。
          - heading "消息持久化的\"三要素\" Permalink to \"消息持久化的\"三要素\"\"" [level=3] [ref=e280]:
            - text: 消息持久化的"三要素"
            - link "Permalink to \"消息持久化的\"三要素\"\"" [ref=e281] [cursor=pointer]:
              - /url: "#消息持久化的-三要素"
              - text: "#"
          - paragraph [ref=e282]:
            - text: 消息在 Broker 重启后不丢失，需要
            - strong [ref=e283]: 三者同时持久化
            - text: ：
          - list [ref=e284]:
            - listitem [ref=e285]:
              - strong [ref=e286]: Exchange
              - code [ref=e287]: durable=true
            - listitem [ref=e288]:
              - strong [ref=e289]: Queue
              - code [ref=e290]: durable=true
            - listitem [ref=e291]:
              - strong [ref=e292]: Message
              - code [ref=e293]: deliveryMode=2
              - text: （PERSISTENT）
          - paragraph [ref=e294]: 少任何一个，Broker 崩溃时消息都会丢失。这是"消息丢了"问题的头号排查点。
          - heading "队列参数的不可变性 Permalink to \"队列参数的不可变性\"" [level=3] [ref=e295]:
            - text: 队列参数的不可变性
            - link "Permalink to \"队列参数的不可变性\"" [ref=e296] [cursor=pointer]:
              - /url: "#队列参数的不可变性"
              - text: "#"
          - paragraph [ref=e297]:
            - text: 声明队列时如果参数（如
            - code [ref=e298]: x-message-ttl
            - text: 、
            - code [ref=e299]: x-max-length
            - text: 、
            - code [ref=e300]: x-queue-type
            - text: ）与已存在队列不一致，会
            - strong [ref=e301]:
              - text: 直接报错
              - code [ref=e302]: PRECONDITION_FAILED
            - text: 。生产环境修改队列参数需要：建新队列 → 切流 → 排空旧队列 → 删旧队列。前期设计要尽量考虑周全，避免后期改结构。
          - separator [ref=e303]
          - heading "Binding 与路由匹配机制 Permalink to \"Binding 与路由匹配机制\"" [level=2] [ref=e304]:
            - text: Binding 与路由匹配机制
            - link "Permalink to \"Binding 与路由匹配机制\"" [ref=e305] [cursor=pointer]:
              - /url: "#binding-与路由匹配机制"
              - text: "#"
          - paragraph [ref=e306]:
            - text: Binding 是 Exchange 和 Queue 之间的路由规则声明，携带一个
            - code [ref=e307]: bindingKey
            - text: （绑定键）。
          - paragraph [ref=e308]:
            - strong [ref=e309]: 两个容易混淆的概念
            - text: ：
          - list [ref=e310]:
            - listitem [ref=e311]:
              - strong [ref=e312]: Routing Key
              - text: ：生产者发送消息时附带的路由标签，跟着消息走。
            - listitem [ref=e313]:
              - strong [ref=e314]: Binding Key
              - text: ：声明 Binding 时设置的匹配模式，跟着绑定关系走。
          - paragraph [ref=e315]: 匹配逻辑取决于 Exchange 类型：
          - paragraph [ref=e316]: 一个 Exchange 可以通过不同 Binding Key 绑定到多个 Queue；一个 Queue 也可以通过多个 Binding Key 绑定到同一个 Exchange，实现"或"关系的复合订阅。
          - separator [ref=e317]
          - heading "Connection & Channel 模型 Permalink to \"Connection & Channel 模型\"" [level=2] [ref=e318]:
            - text: Connection & Channel 模型
            - link "Permalink to \"Connection & Channel 模型\"" [ref=e319] [cursor=pointer]:
              - /url: "#connection-channel-模型"
              - text: "#"
          - list [ref=e320]:
            - listitem [ref=e321]:
              - strong [ref=e322]: Connection
              - text: ：与 Broker 的 TCP 长连接，
              - strong [ref=e323]: 重量级
              - text: ，应用生命周期内保持，不要频繁创建销毁。
            - listitem [ref=e324]:
              - strong [ref=e325]: Channel
              - text: ：在 Connection 之上的
              - strong [ref=e326]: 逻辑通道
              - text: ，AMQP 的所有操作（声明、发送、消费）都在 Channel 上进行。
          - paragraph [ref=e327]:
            - strong [ref=e328]: Channel 不是线程安全的
            - text: 。同一 Channel 不能跨线程并发发送。Spring AMQP 的
            - code [ref=e329]: CachingConnectionFactory
            - text: 会缓存 Channel，多线程场景下每个线程使用独立的 Channel，应用层通常不需要额外处理。但如果自定义 Channel，必须保证线程隔离。
          - separator [ref=e330]
          - heading "消息可靠性三段保障 Permalink to \"消息可靠性三段保障\"" [level=2] [ref=e331]:
            - text: 消息可靠性三段保障
            - link "Permalink to \"消息可靠性三段保障\"" [ref=e332] [cursor=pointer]:
              - /url: "#消息可靠性三段保障"
              - text: "#"
          - paragraph [ref=e333]: 要做到"消息不丢、不重复处理"，需要从生产端、Broker、消费端三段同时保障。
          - heading "生产端：Confirm + Return Permalink to \"生产端：Confirm + Return\"" [level=3] [ref=e334]:
            - text: 生产端：Confirm + Return
            - link "Permalink to \"生产端：Confirm + Return\"" [ref=e335] [cursor=pointer]:
              - /url: "#生产端-confirm-return"
              - text: "#"
          - table [ref=e336]:
            - rowgroup [ref=e337]:
              - row "机制 作用" [ref=e338]:
                - columnheader "机制" [ref=e339]
                - columnheader "作用" [ref=e340]
            - rowgroup [ref=e341]:
              - row "Publisher Confirm 消息到达 Broker 后异步回调 ack，网络失败或 Broker 拒收时回调 nack" [ref=e342]:
                - cell "Publisher Confirm" [ref=e343]:
                  - strong [ref=e344]: Publisher Confirm
