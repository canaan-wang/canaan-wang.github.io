            - text: "\"。与 Kafka 的 Topic-Partition 模型不同，RabbitMQ 引入"
            - code [ref=e121]: Exchange
            - text: 作为路由分发层，生产者不直接发队列，而是由 Exchange 根据绑定规则决定消息的投递目标。这层抽象让它在事件驱动架构（EDA）和复杂路由场景中成为首选。
