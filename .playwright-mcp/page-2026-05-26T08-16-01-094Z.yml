          - paragraph [ref=e179]:
            - strong [ref=e180]: 核心优势
            - text: ：路由灵活、延迟低、管理界面完善、可靠性机制丰富（Confirm、Ack、Quorum Queue），适合订单、支付等对消息不能丢的业务场景。
