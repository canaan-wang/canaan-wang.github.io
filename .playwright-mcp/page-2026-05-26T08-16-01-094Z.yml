                - cell "fanout" [ref=e216]:
                  - code [ref=e217]: fanout
                - cell "忽略 Routing Key，广播给所有绑定 Queue" [ref=e218]:
                  - strong [ref=e219]: 忽略
                  - text: Routing Key，广播给所有绑定 Queue
                - cell "事件多消费方" [ref=e220]
              - 'row "topic Binding Key 用 *（一个单词）和 #（零或多个单词）通配 灵活订阅，最常用" [ref=e221]':
                - cell "topic" [ref=e222]:
                  - code [ref=e223]: topic
                - 'cell "Binding Key 用 *（一个单词）和 #（零或多个单词）通配" [ref=e224]':
                  - text: Binding Key 用
                  - code [ref=e225]: "*"
                  - text: （一个单词）和
                  - code [ref=e226]: "#"
                  - text: （零或多个单词）通配
                - cell "灵活订阅，最常用" [ref=e227]
              - row "headers 按消息 Headers KV 匹配 很少用，性能差" [ref=e228]:
                - cell "headers" [ref=e229]:
                  - code [ref=e230]: headers
                - cell "按消息 Headers KV 匹配" [ref=e231]
                - cell "很少用，性能差" [ref=e232]
          - paragraph [ref=e233]:
            - strong [ref=e234]: 关键属性
            - text: ：
          - list [ref=e235]:
            - listitem [ref=e236]:
              - code [ref=e237]: durable=true
              - text: ：Broker 重启后 Exchange 定义保留。
            - listitem [ref=e238]:
              - code [ref=e239]: autoDelete=false
              - text: ：无 Queue 绑定时也不自动删除（生产环境推荐）。
          - paragraph [ref=e240]:
            - strong [ref=e241]: 黑洞消息陷阱
            - text: ：没有匹配到任何 Queue 的消息会被
            - strong [ref=e242]: 直接丢弃
            - text: 。必须配置
            - code [ref=e243]: mandatory=true
            - text: + Return 回调，或设置 Alternate Exchange 兜底，否则会出现"发送成功但消息消失"的灵异事件。
          - separator [ref=e244]
          - heading "Queue 与消息存储原理 Permalink to \"Queue 与消息存储原理\"" [level=2] [ref=e245]:
