          - table [ref=e365]:
            - rowgroup [ref=e366]:
              - row "机制 原理" [ref=e367]:
                - columnheader "机制" [ref=e368]
                - columnheader "原理" [ref=e369]
            - rowgroup [ref=e370]:
              - row "manual ack 业务真正处理完成才发送 basicAck，处理失败或崩溃时消息重新投递" [ref=e371]:
                - cell "manual ack" [ref=e372]:
                  - code [ref=e373]: manual ack
