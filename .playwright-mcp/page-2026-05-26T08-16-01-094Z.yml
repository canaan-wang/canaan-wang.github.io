                  - text: 消息到达 Broker 后异步回调
                  - code [ref=e346]: ack
                  - text: ，网络失败或 Broker 拒收时回调
                  - code [ref=e347]: nack
              - row "Return Callback mandatory=true 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息" [ref=e348]:
                - cell "Return Callback" [ref=e349]:
                  - strong [ref=e350]: Return Callback
                - cell "mandatory=true 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息" [ref=e351]:
                  - code [ref=e352]: mandatory=true
                  - text: 时，路由不到任何 Queue 触发 Return 回调，暴露黑洞消息
          - paragraph [ref=e353]: Confirm 是异步的，不阻塞发送线程。如果业务需要强一致性，可配合本地消息表（Outbox 模式）：先写业务 DB + 消息记录表，异步任务扫描未确认记录重发。
          - heading "Broker 端：持久化 + Quorum Queue Permalink to \"Broker 端：持久化 + Quorum Queue\"" [level=3] [ref=e354]:
            - text: Broker 端：持久化 + Quorum Queue
            - link "Permalink to \"Broker 端：持久化 + Quorum Queue\"" [ref=e355] [cursor=pointer]:
              - /url: "#broker-端-持久化-quorum-queue"
              - text: "#"
          - list [ref=e356]:
            - listitem [ref=e357]:
              - text: Exchange、Queue、Message
              - strong [ref=e358]: 三者都持久化
              - text: （见上文"三要素"）。
            - listitem [ref=e359]:
              - text: 使用
              - strong [ref=e360]: Quorum Queue
              - text: （多节点 Raft 复制），而非单机 Classic Queue。
            - listitem [ref=e361]:
              - text: 集群至少 3 节点，磁盘/内存水位（
              - code [ref=e362]: vm_memory_high_watermark
              - text: ）需监控，打满后 Broker 会拒绝新发布。
          - heading "消费端：Manual Ack + 幂等 + 死信 Permalink to \"消费端：Manual Ack + 幂等 + 死信\"" [level=3] [ref=e363]:
