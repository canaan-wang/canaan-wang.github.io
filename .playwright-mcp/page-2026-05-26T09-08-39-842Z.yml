                  - cell "A 系统直接调用 B 接口，B 挂了 A 也受影响" [ref=e164]
                  - cell "A 发消息到 MQ，B 自己消费，两边解耦" [ref=e165]
                - row "流量突增 秒杀时请求直接打到数据库，瞬间崩 请求先入 MQ，后端按消费能力慢慢处理" [ref=e166]:
