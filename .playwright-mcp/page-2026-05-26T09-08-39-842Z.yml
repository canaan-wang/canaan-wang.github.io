                  - cell "fanout" [ref=e290]:
                    - code [ref=e291]: fanout
                  - cell "忽略 Routing Key，广播给所有绑定 Queue" [ref=e292]:
                    - strong [ref=e293]: 忽略
                    - text: Routing Key，广播给所有绑定 Queue
                  - cell "事件多消费方" [ref=e294]
                - 'row "topic Binding Key 用 *（一个单词）和 #（零或多个单词）通配 灵活订阅，最常用" [ref=e295]':
                  - cell "topic" [ref=e296]:
                    - code [ref=e297]: topic
                  - 'cell "Binding Key 用 *（一个单词）和 #（零或多个单词）通配" [ref=e298]':
                    - text: Binding Key 用
                    - code [ref=e299]: "*"
                    - text: （一个单词）和
                    - code [ref=e300]: "#"
                    - text: （零或多个单词）通配
                  - cell "灵活订阅，最常用" [ref=e301]
                - row "headers 按消息 Headers KV 匹配 很少用，性能差" [ref=e302]:
