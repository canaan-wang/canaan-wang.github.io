            - paragraph [ref=e801]: Quorum Queue 是 RabbitMQ 3.8+ 引入的高可靠队列，基于 Raft 共识算法：
            - list [ref=e802]:
              - listitem [ref=e803]:
                - text: 一个 Queue 有
                - strong [ref=e804]: 1 个 Leader + N 个 Follower
                - text: ，分布在不同节点。
              - listitem [ref=e805]:
                - text: 写入需
                - strong [ref=e806]: 多数派确认
                - text: （W > N/2）才返回成功。
              - listitem [ref=e807]: Leader 宕机时，Follower 之间自动选举新 Leader，Consumer 自动重连到新 Leader。
            - paragraph [ref=e808]: 相比旧版的 Classic Mirrored Queue（已移除），Quorum Queue 的故障恢复更快、数据一致性更强，但写入延迟略高、不支持独占队列和非持久化消息。
