              - text: ：
            - list [ref=e309]:
              - listitem [ref=e310]:
                - code [ref=e311]: durable=true
                - text: ：Broker 重启后 Exchange 定义保留。
              - listitem [ref=e312]:
                - code [ref=e313]: autoDelete=false
                - text: ：无 Queue 绑定时也不自动删除（生产环境推荐）。
            - paragraph [ref=e314]:
              - strong [ref=e315]: 黑洞消息陷阱
              - text: ：没有匹配到任何 Queue 的消息会被
              - strong [ref=e316]: 直接丢弃
              - text: 。必须配置
              - code [ref=e317]: mandatory=true
              - text: + Return 回调，或设置 Alternate Exchange 兜底，否则会出现"发送成功但消息消失"的灵异事件。
