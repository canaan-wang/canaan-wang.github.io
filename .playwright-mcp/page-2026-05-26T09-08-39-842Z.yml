            - list [ref=e785]:
              - listitem [ref=e786]:
                - text: CPU 密集型业务：
                - code [ref=e787]: prefetch = 1~5
              - listitem [ref=e788]:
                - text: IO 密集型业务：
                - code [ref=e789]: prefetch = 10~50
              - listitem [ref=e790]:
                - text: 需要严格顺序：
                - code [ref=e791]: prefetch = 1
                - text: + 单消费者
            - paragraph [ref=e792]:
              - text: Prefetch 的本质是
              - strong [ref=e793]: 背压（backpressure）
              - text: ：Consumer 处理能力下降时，未 ack 消息堆积达到 prefetch 上限，Broker 停止向该 Consumer 推送，消息自然流向其他空闲 Consumer。
