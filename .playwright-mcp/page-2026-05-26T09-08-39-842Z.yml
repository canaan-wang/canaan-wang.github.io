            - paragraph [ref=e258]:
              - text: RabbitMQ 与 Kafka 的本质区别不在性能，而在
              - strong [ref=e259]: 消息分发的抽象层
              - text: ：
            - list [ref=e260]:
              - listitem [ref=e261]:
                - strong [ref=e262]: Kafka
                - text: ：Producer → Topic → Partition → Consumer，路由在客户端决定（指定 partition key）。
              - listitem [ref=e263]:
                - strong [ref=e264]: RabbitMQ
                - text: ：Producer →
                - strong [ref=e265]: Exchange
                - text: → (Binding + Routing Key) → Queue → Consumer，路由在 Broker 内完成，支持运行时动态调整订阅关系。
            - paragraph [ref=e266]:
              - strong [ref=e267]: Exchange 是必选环节
              - text: 。即使生产者不指定 Exchange，消息也会走默认的
              - code [ref=e268]: "\"\""
              - text: Exchange（direct 类型，Routing Key 等于 Queue 名），这是新手容易忽略的设计细节。
            - separator [ref=e269]
            - heading "Exchange 路由原理 Permalink to \"Exchange 路由原理\"" [level=2] [ref=e270]:
              - text: Exchange 路由原理
              - link "Permalink to \"Exchange 路由原理\"" [ref=e271] [cursor=pointer]:
