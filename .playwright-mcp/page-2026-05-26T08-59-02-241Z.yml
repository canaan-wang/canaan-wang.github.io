              - text: ：消息被拒绝且不重回队列（
              - code [ref=e776]: requeue=false
              - text: ）、消息 TTL 过期、队列长度超限。
            - paragraph [ref=e777]:
              - strong [ref=e778]: 幂等是必须项
              - text: ：RabbitMQ 保证"至少一次投递"，网络重连、ack 丢失、消费者重启都会导致重投。业务端幂等 + MQ 至少一次投递 = 事实上的精确一次。RabbitMQ 不像 Kafka 有 exactly-once 事务语义，幂等是消费者必须自己做的事。
            - paragraph [ref=e779]:
              - strong [ref=e780]: 无限重投陷阱
              - text: ：
              - code [ref=e781]: basicNack(requeue=true)
              - text: 如果 Consumer 代码有 bug（如反序列化异常），会形成死循环把队列打爆。应限制重试次数（消息头
              - code [ref=e782]: x-death
              - text: 数组记录每次死信信息，超过 N 次直接进 DLQ），或用延迟队列做退避。
