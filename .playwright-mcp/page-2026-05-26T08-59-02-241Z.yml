              - text: RabbitMQ 与 Kafka 的本质区别不在性能，而在
              - strong [ref=e264]: 消息分发的抽象层
              - text: ：
            - list [ref=e265]:
              - listitem [ref=e266]:
                - strong [ref=e267]: Kafka
                - text: ：Producer → Topic → Partition → Consumer，路由在客户端决定（指定 partition key）。
              - listitem [ref=e268]:
                - strong [ref=e269]: RabbitMQ
                - text: ：Producer →
                - strong [ref=e270]: Exchange
                - text: → (Binding + Routing Key) → Queue → Consumer，路由在 Broker 内完成，支持运行时动态调整订阅关系。
            - paragraph [ref=e271]:
              - strong [ref=e272]: Exchange 是必选环节
              - text: 。即使生产者不指定 Exchange，消息也会走默认的
              - code [ref=e273]: "\"\""
              - text: Exchange（direct 类型，Routing Key 等于 Queue 名），这是新手容易忽略的设计细节。
