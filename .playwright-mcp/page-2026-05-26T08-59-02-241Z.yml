                - text: "#"
            - paragraph [ref=e835]: Quorum Queue 是 RabbitMQ 3.8+ 引入的高可靠队列，基于 Raft 共识算法：
            - list [ref=e836]:
              - listitem [ref=e837]:
                - text: 一个 Queue 有
                - strong [ref=e838]: 1 个 Leader + N 个 Follower
                - text: ，分布在不同节点。
              - listitem [ref=e839]:
                - text: 写入需
                - strong [ref=e840]: 多数派确认
                - text: （W > N/2）才返回成功。
              - listitem [ref=e841]: Leader 宕机时，Follower 之间自动选举新 Leader，Consumer 自动重连到新 Leader。
            - paragraph [ref=e842]: 相比旧版的 Classic Mirrored Queue（已移除），Quorum Queue 的故障恢复更快、数据一致性更强，但写入延迟略高、不支持独占队列和非持久化消息。
            - heading "vhost 逻辑隔离 Permalink to \"vhost 逻辑隔离\"" [level=3] [ref=e843]:
