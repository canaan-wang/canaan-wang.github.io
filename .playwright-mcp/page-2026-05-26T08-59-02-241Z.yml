                - text: "#"
            - paragraph [ref=e845]: vhost（Virtual Host）是 RabbitMQ 的逻辑隔离单位，类似数据库的 schema：
            - list [ref=e846]:
              - listitem [ref=e847]: Exchange、Queue、用户权限都按 vhost 隔离。
              - listitem [ref=e848]:
                - text: 默认 vhost 是
                - code [ref=e849]: /
                - text: ，生产环境建议按业务或环境分 vhost（如
                - code [ref=e850]: /order-prod
                - text: 、
                - code [ref=e851]: /order-test
                - text: ）。
              - listitem [ref=e852]:
