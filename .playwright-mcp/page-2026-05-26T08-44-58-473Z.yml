              - code [ref=e691]:
                - generic [ref=e692]: prefetch = N 表示 Broker 最多给消费者推送 N 条未 ack 的消息
            - list [ref=e693]:
              - listitem [ref=e694]:
                - text: CPU 密集型业务：
                - code [ref=e695]: prefetch = 1~5
              - listitem [ref=e696]:
                - text: IO 密集型业务：
                - code [ref=e697]: prefetch = 10~50
              - listitem [ref=e698]:
                - text: 需要严格顺序：
                - code [ref=e699]: prefetch = 1
                - text: + 单消费者
            - paragraph [ref=e700]:
              - text: Prefetch 的本质是
              - strong [ref=e701]: 背压（backpressure）
              - text: ：Consumer 处理能力下降时，未 ack 消息堆积达到 prefetch 上限，Broker 停止向该 Consumer 推送，消息自然流向其他空闲 Consumer。
