                - text: "#"
            - paragraph [ref=e340]:
              - text: Exchange 是消息的路由分发器，
              - strong [ref=e341]: 生产者只能往 Exchange 发消息
              - text: ，不能直接发到 Queue。
            - heading "四种路由类型 Permalink to \"四种路由类型\"" [level=3] [ref=e342]:
