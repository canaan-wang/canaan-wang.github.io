              - text: RabbitMQ 是一个开源的
              - strong [ref=e156]: 消息中间件
              - text: （Message Broker），基于 AMQP 0-9-1 协议实现，用 Erlang 开发。它的核心作用是
              - strong [ref=e157]: 帮不同的系统之间异步传递消息
              - text: 。
            - heading "它解决什么问题 Permalink to \"它解决什么问题\"" [level=3] [ref=e158]:
