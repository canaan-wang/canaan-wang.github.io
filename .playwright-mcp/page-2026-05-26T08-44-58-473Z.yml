                    - code [ref=e359]: fanout
                  - cell "忽略 Routing Key，广播给所有绑定 Queue" [ref=e360]:
                    - strong [ref=e361]: 忽略
                    - text: Routing Key，广播给所有绑定 Queue
                  - cell "事件多消费方" [ref=e362]
                - 'row "topic Binding Key 用 *（一个单词）和 #（零或多个单词）通配 灵活订阅，最常用" [ref=e363]':
                  - cell "topic" [ref=e364]:
                    - code [ref=e365]: topic
                  - 'cell "Binding Key 用 *（一个单词）和 #（零或多个单词）通配" [ref=e366]':
                    - text: Binding Key 用
                    - code [ref=e367]: "*"
                    - text: （一个单词）和
                    - code [ref=e368]: "#"
                    - text: （零或多个单词）通配
                  - cell "灵活订阅，最常用" [ref=e369]
                - row "headers 按消息 Headers KV 匹配 很少用，性能差" [ref=e370]:
                  - cell "headers" [ref=e371]:
