            - paragraph [ref=e326]:
              - text: RabbitMQ 与 Kafka 的本质区别不在性能，而在
              - strong [ref=e327]: 消息分发的抽象层
              - text: ：
            - list [ref=e328]:
              - listitem [ref=e329]:
                - strong [ref=e330]: Kafka
                - text: ：Producer → Topic → Partition → Consumer，路由在客户端决定（指定 partition key）。
              - listitem [ref=e331]:
                - strong [ref=e332]: RabbitMQ
                - text: ：Producer →
                - strong [ref=e333]: Exchange
                - text: → (Binding + Routing Key) → Queue → Consumer，路由在 Broker 内完成，支持运行时动态调整订阅关系。
            - paragraph [ref=e334]:
              - strong [ref=e335]: Exchange 是必选环节
              - text: 。即使生产者不指定 Exchange，消息也会走默认的
              - code [ref=e336]: "\"\""
              - text: Exchange（direct 类型，Routing Key 等于 Queue 名），这是新手容易忽略的设计细节。
            - separator [ref=e337]
            - heading "Exchange 路由原理 Permalink to \"Exchange 路由原理\"" [level=2] [ref=e338]:
              - text: Exchange 路由原理
              - link "Permalink to \"Exchange 路由原理\"" [ref=e339] [cursor=pointer]:
