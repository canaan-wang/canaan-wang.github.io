            - list [ref=e720]:
              - listitem [ref=e721]: Exchange、Queue、用户权限都按 vhost 隔离。
              - listitem [ref=e722]:
                - text: 默认 vhost 是
                - code [ref=e723]: /
                - text: ，生产环境建议按业务或环境分 vhost（如
                - code [ref=e724]: /order-prod
                - text: 、
                - code [ref=e725]: /order-test
                - text: ）。
