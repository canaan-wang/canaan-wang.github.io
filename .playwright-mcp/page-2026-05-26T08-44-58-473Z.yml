                  - cell "很少用，性能差" [ref=e374]
            - paragraph [ref=e375]:
              - strong [ref=e376]: 关键属性
              - text: ：
            - list [ref=e377]:
              - listitem [ref=e378]:
                - code [ref=e379]: durable=true
                - text: ：Broker 重启后 Exchange 定义保留。
              - listitem [ref=e380]:
                - code [ref=e381]: autoDelete=false
                - text: ：无 Queue 绑定时也不自动删除（生产环境推荐）。
            - paragraph [ref=e382]:
              - strong [ref=e383]: 黑洞消息陷阱
              - text: ：没有匹配到任何 Queue 的消息会被
              - strong [ref=e384]: 直接丢弃
              - text: 。必须配置
              - code [ref=e385]: mandatory=true
              - text: + Return 回调，或设置 Alternate Exchange 兜底，否则会出现"发送成功但消息消失"的灵异事件。
