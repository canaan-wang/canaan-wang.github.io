<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canaan' Blog</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme" type="text/css" />
</head>
<body>
  <!-- docsify 容器 -->
  <div id="app"></div>
  <script>
    window.$docsify = {
      topMargin: 90, // default: 0
      name: 'Canaan Blog',
      nameLink: '/',
      repo: 'https://github.com/canaan-wang/canaan-wang.github.io',
      loadSidebar: true,
      sidebarDisplayLevel: 2,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: true,
      // 主题色取外链脚本生成的中值，若不可用则提供兜底色
      themeColor: (window.SiteTheme && window.SiteTheme.pair && window.SiteTheme.pair.themeHex) || '#4c8bf5',
      // 插件来自外链脚本，若不可用则为空
      plugins: (window.SiteTheme && window.SiteTheme.coverPlugin) ? [window.SiteTheme.coverPlugin] : [],
      mermaidConfig: {
        querySelector: ".mermaid"
      },
    };
  </script>

  <!-- Docsify v4（保留一次加载，移除重复脚本） -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- 站点主题与封面渐变（外链脚本，提供 SiteTheme API） -->
  <script src="assets/cover-theme.js"></script>

  </script>
  <!-- Import D3.js -->
  <script src="//cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script src="//unpkg.com/docsify-mermaid-zoom/dist/docsify-mermaid-zoom.js"></script>
  <!-- 深色/浅色主题切换插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript">
  </script>
</body>
</html>
